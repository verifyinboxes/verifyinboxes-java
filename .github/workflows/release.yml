name: Release

# Pushing a tag vX.Y.Z publishes that version to Maven Central through the Central Portal.
#
# Runs in the environment "maven-central" (Settings, Environments), which only tags v* may deploy to, and needs its
# four secrets (the environment's own, so that no other workflow or branch can read them):
#   CENTRAL_TOKEN_USERNAME, CENTRAL_TOKEN_PASSWORD   a Central Portal user token (central.sonatype.com, Account)
#   MAVEN_GPG_PRIVATE_KEY, MAVEN_GPG_PASSPHRASE      the armoured private key that signs the files, and its passphrase
# and the namespace com.verifyinboxes verified on the Central Portal. Without the secrets the first step stops the
# run before anything is built. The upload is one deployment: Central publishes it whole or not at all, and a
# published version can never be changed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central
    if: github.repository == 'verifyinboxes/verifyinboxes-java'
    runs-on: ubuntu-latest
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/com.verifyinboxes/verifyinboxes-java
    env:
      CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
      CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
    steps:
      - name: The release secrets are set
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$CENTRAL_TOKEN_USERNAME" ] || missing="$missing CENTRAL_TOKEN_USERNAME"
          [ -n "$CENTRAL_TOKEN_PASSWORD" ] || missing="$missing CENTRAL_TOKEN_PASSWORD"
          [ -n "$MAVEN_GPG_PRIVATE_KEY" ] || missing="$missing MAVEN_GPG_PRIVATE_KEY"
          [ -n "$MAVEN_GPG_PASSPHRASE" ] || missing="$missing MAVEN_GPG_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error::these secrets of the maven-central environment are not set:$missing. Nothing was built or published."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          # Writes the Maven server "central", which reads the token from these environment variables, and imports
          # the signing key.
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: The tag is the version in pom.xml
        run: |
          # The project's own <version>, the only one at that indentation (the library reads it at build time).
          version=$(sed -n 's|^  <version>\(.*\)</version>$|\1|p' pom.xml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but pom.xml says $version"
            exit 1
          fi
      # Tests, builds the jar, the sources jar and the javadoc jar, signs them and publishes them as one deployment.
      - run: ./mvnw --batch-mode --no-transfer-progress -Prelease deploy
